name: Materialize binaries
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode base64 assets, commit, try enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            # strip leading ./
            base64 -d "$f" > "$out"
            rm -f "$f"
            count=$((count+1))
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done < <(find . -type f -name '*.b64' -print0)
          echo "decoded_count=$count"
          if [ "$count" -eq 0 ]; then
            echo "No .b64 files found"
            exit 1
          fi
          rm -f .github/workflows/materialize-binaries.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add binary assets (images, PDFs, font) from encoded sources"
          git push
          echo "Attempting to enable GitHub Pages from main / with custom domain maxlongusa.com"
          set +e
          gh api --method POST /repos/${GITHUB_REPOSITORY}/pages \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "source": {"branch": "main", "path": "/"},
            "build_type": "legacy"
          }
          EOF
          post_rc=$?
          gh api --method PUT /repos/${GITHUB_REPOSITORY}/pages \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {
            "cname": "maxlongusa.com",
            "source": {"branch": "main", "path": "/"}
          }
          EOF
          put_rc=$?
          echo "pages_post_rc=$post_rc pages_put_rc=$put_rc"
          gh api /repos/${GITHUB_REPOSITORY}/pages -H "Accept: application/vnd.github+json" || true
          if [ "$post_rc" -ne 0 ] && [ "$put_rc" -ne 0 ]; then
            echo "Pages API could not enable or update Pages; this may need a manual Settings step."
          fi
          exit 0
